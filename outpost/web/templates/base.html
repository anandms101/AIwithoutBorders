<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Outpost{% endblock %}</title>
<style>
/* No CDN, no webfonts, no build step. The venue has no Wi-Fi.
   Light theme deliberately: projectors wash out dark backgrounds. */
:root {
  --bg: #f5f7f9; --panel: #ffffff; --line: #dfe5ea; --line-soft: #eef2f5;
  --text: #16232e; --muted: #6b7c8a; --faint: #9aa8b4;
  --accent: #1668b3; --accent-soft: #e7f1fa;
  --ok: #17794a; --ok-soft: #e4f4ec;
  --warn: #9a6207; --warn-soft: #fdf2dd;
  --danger: #b3261e; --danger-soft: #fbe9e7;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --shadow: 0 1px 2px rgba(16,35,46,.06), 0 2px 8px rgba(16,35,46,.05);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

header {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 12px 22px; background: var(--panel);
  border-bottom: 1px solid var(--line);
}
header .brand { font-size: 17px; font-weight: 700; letter-spacing: 1.2px; }
header .site { color: var(--muted); font-size: 12px; font-family: var(--mono); }
header .spacer { flex: 1; }
.badge-local {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--ok-soft); color: var(--ok); border: 1px solid #bfe3d0;
  padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
}
.badge-local .dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--ok);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
#models { font-family: var(--mono); font-size: 11px; color: var(--muted); }

.wrap { padding: 20px 22px 40px; max-width: 1560px; margin: 0 auto; }

/* ---------- pipeline ---------- */
.pipeline {
  display: flex; align-items: stretch; margin-bottom: 20px;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 16px 10px; box-shadow: var(--shadow);
  overflow-x: auto;
}
.stage {
  flex: 1 1 0; min-width: 132px; text-align: center; padding: 4px 8px;
  position: relative;
}
.stage .ico {
  width: 40px; height: 40px; margin: 0 auto 8px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  background: var(--line-soft); color: var(--muted);
  font-size: 19px; transition: all .3s ease; border: 1px solid var(--line);
}
.stage.active .ico {
  background: var(--accent-soft); color: var(--accent); border-color: #b6d5ee;
  animation: throb 1.1s ease-in-out infinite;
}
.stage.done .ico { background: var(--ok-soft); color: var(--ok); border-color: #bfe3d0; }
.stage.alertish .ico { background: var(--warn-soft); color: var(--warn); border-color: #f0dcae; }
@keyframes throb {
  0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(22,104,179,.28) }
  50% { transform: scale(1.07); box-shadow: 0 0 0 7px rgba(22,104,179,0) }
}
.stage .name {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .7px; color: var(--muted);
}
.stage .val {
  font-family: var(--mono); font-size: 17px; font-weight: 700; margin-top: 3px;
}
.stage .sub { font-size: 11px; color: var(--faint); margin-top: 1px; min-height: 15px; }
.arrow {
  align-self: center; color: var(--line); font-size: 17px; padding: 0 2px;
  flex: 0 0 auto; margin-bottom: 26px;
}
.arrow.flowing { color: var(--accent); animation: slide 1.1s ease-in-out infinite; }
@keyframes slide {
  0%,100% { transform: translateX(-2px); opacity: .5 }
  50% { transform: translateX(3px); opacity: 1 }
}

/* ---------- drop zone ---------- */
.dropzone {
  border: 2px dashed var(--line); border-radius: 10px; background: var(--panel);
  padding: 22px; text-align: center; margin-bottom: 20px;
  transition: all .18s ease; cursor: pointer;
}
.dropzone:hover { border-color: var(--accent); background: #fbfdff; }
.dropzone.over {
  border-color: var(--accent); background: var(--accent-soft); border-style: solid;
}
.dropzone .big { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.dropzone .hint { color: var(--muted); font-size: 12.5px; }
.dropzone .hint code {
  font-family: var(--mono); background: var(--line-soft);
  padding: 1px 5px; border-radius: 3px; font-size: 11.5px;
}
#uploadMsg { margin-top: 9px; font-size: 12.5px; min-height: 17px; }
.catchment-row {
  margin-top: 12px; display: flex; align-items: center; justify-content: center;
  gap: 8px; font-size: 12.5px;
}
.catchment-row label { color: var(--muted); font-weight: 600; }
.catchment-row select {
  font: inherit; font-family: var(--mono); font-size: 12.5px;
  padding: 4px 8px; border-radius: 5px; border: 1px solid var(--line);
  background: #fff; color: var(--text); cursor: pointer;
}

/* ---------- counters ---------- */
.counters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
.counter {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 15px; min-width: 112px; box-shadow: var(--shadow);
}
.counter .v { font-size: 20px; font-weight: 700; font-family: var(--mono); }
.counter .k {
  color: var(--muted); font-size: 10.5px; text-transform: uppercase;
  letter-spacing: .6px; margin-top: 1px;
}
.counter.good { border-left: 3px solid var(--ok); }
.counter.good .v { color: var(--ok); }
.counter.warn { border-left: 3px solid var(--warn); }
.counter.warn .v { color: var(--warn); }
.counter.hero { border-left: 3px solid var(--accent); }
.counter.hero .v { color: var(--accent); }

/* ---------- layout ---------- */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 1180px) { .grid { grid-template-columns: 1fr; } }
.panel {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; overflow: hidden; box-shadow: var(--shadow);
}
.panel > h2 {
  margin: 0; padding: 11px 16px; font-size: 12px; text-transform: uppercase;
  letter-spacing: .8px; color: var(--muted); border-bottom: 1px solid var(--line);
  background: #fbfcfd; font-weight: 700;
}
.panel .body { max-height: 470px; overflow-y: auto; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 16px; border-bottom: 1px solid var(--line-soft); }
th {
  color: var(--muted); font-weight: 600; font-size: 10.5px;
  text-transform: uppercase; letter-spacing: .5px;
}
tr:last-child td { border-bottom: none; }
tbody tr:hover { background: #fbfcfd; }
.mono { font-family: var(--mono); font-size: 12px; }

.pill {
  display: inline-block; padding: 2px 8px; border-radius: 11px;
  font-size: 11px; font-family: var(--mono); font-weight: 600;
}
.pill.queued, .pill.low { background: var(--accent-soft); color: var(--accent); }
.pill.running { background: var(--warn-soft); color: var(--warn); }
.pill.done { background: var(--ok-soft); color: var(--ok); }
.pill.failed, .pill.high { background: var(--danger-soft); color: var(--danger); }
.pill.moderate { background: var(--warn-soft); color: var(--warn); }
.pill.agent { background: var(--accent-soft); color: var(--accent); }
.pill.template { background: var(--line-soft); color: var(--muted); }

.alert {
  border: 1px solid var(--line); border-left: 4px solid var(--warn);
  border-radius: 8px; padding: 14px 16px; margin: 14px 16px; background: #fffdf8;
}
.alert.high { border-left-color: var(--danger); background: #fffaf9; }
.alert h3 { margin: 0 0 7px; font-size: 15.5px; }
.alert p { margin: 7px 0; }
.alert .meta { color: var(--muted); font-size: 12px; }
.actions { display: flex; gap: 9px; margin-top: 12px; align-items: center; }
button {
  font: inherit; font-weight: 600; padding: 7px 15px; border-radius: 6px;
  cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--text);
}
button:hover { background: var(--line-soft); }
button.approve { background: var(--ok); border-color: var(--ok); color: #fff; }
button.approve:hover { filter: brightness(1.1); }
button.dismiss { background: #fff; border-color: var(--line); color: var(--muted); }

.empty { padding: 26px 16px; color: var(--faint); text-align: center; font-size: 13px; }
.trace-row td { padding: 6px 16px; }
.trace-err { color: var(--danger); }
.note {
  margin: 11px 16px; padding: 9px 12px; border-radius: 6px;
  background: var(--accent-soft); color: #14507f; font-size: 12.5px;
  border: 1px solid #cfe3f4;
}
pre.payload {
  margin: 8px 0 0; padding: 9px 11px; background: #0f1b24; border-radius: 5px;
  font-family: var(--mono); font-size: 11.5px; overflow-x: auto; color: #7ee2a0;
}
</style>
</head>
<body>
<header>
  <span class="brand">OUTPOST</span>
  <span class="site">{{ settings.site_id if settings else '' }}</span>
  <span class="badge-local"><span class="dot"></span> All inference local</span>
  <span id="models"></span>
  <span class="spacer"></span>
  <span class="site">no patient data leaves the box</span>
</header>
<div class="wrap">
{% block content %}{% endblock %}
</div>
<script>
// Show which models are actually resident. The locality claim should be
// visible on screen, not merely asserted in the narration.
fetch('/api/models').then(r => r.json()).then(d => {
  const el = document.getElementById('models');
  if (!el) return;
  el.textContent = d.models.length
    ? d.models.map(m => `${m.name} ${m.size_gb}GB`).join('  ·  ')
    : d.host;
}).catch(() => {});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
