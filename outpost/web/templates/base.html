<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Outpost{% endblock %}</title>
<style>
/* No CDN, no webfonts, no build step. The venue has no Wi-Fi. */
:root {
  --bg: #0f1417; --panel: #161d21; --line: #26323a; --text: #e6edf3;
  --muted: #8b9aa7; --accent: #4bb3fd; --ok: #3fb950; --warn: #d29922;
  --danger: #f85149; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
header {
  display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
}
header h1 { margin: 0; font-size: 18px; letter-spacing: .5px; }
header .tag { color: var(--muted); font-size: 12px; }
.wrap { padding: 20px; max-width: 1500px; margin: 0 auto; }
.counters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.counter {
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 10px 14px; min-width: 108px;
}
.counter .v { font-size: 20px; font-weight: 600; font-family: var(--mono); }
.counter .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
.counter.good .v { color: var(--ok); }
.counter.warn .v { color: var(--warn); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
.panel {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; overflow: hidden;
}
.panel > h2 {
  margin: 0; padding: 10px 14px; font-size: 13px; text-transform: uppercase;
  letter-spacing: .8px; color: var(--muted); border-bottom: 1px solid var(--line);
}
.panel .body { max-height: 460px; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 7px 14px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; }
tr:last-child td { border-bottom: none; }
.mono { font-family: var(--mono); font-size: 12px; }
.pill {
  display: inline-block; padding: 1px 7px; border-radius: 10px;
  font-size: 11px; font-family: var(--mono);
}
.pill.queued { background: #1f2d36; color: var(--accent); }
.pill.running { background: #33291a; color: var(--warn); }
.pill.done { background: #11301c; color: var(--ok); }
.pill.failed { background: #3a1a1c; color: var(--danger); }
.pill.high { background: #3a1a1c; color: var(--danger); }
.pill.moderate { background: #33291a; color: var(--warn); }
.pill.low { background: #1f2d36; color: var(--accent); }
.pill.agent { background: #1c2f3a; color: var(--accent); }
.pill.template { background: #24292e; color: var(--muted); }
.alert {
  border: 1px solid var(--line); border-left: 3px solid var(--warn);
  border-radius: 4px; padding: 12px 14px; margin: 12px 14px;
}
.alert.high { border-left-color: var(--danger); }
.alert h3 { margin: 0 0 6px; font-size: 15px; }
.alert p { margin: 6px 0; }
.alert .meta { color: var(--muted); font-size: 12px; }
.actions { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
button {
  font: inherit; padding: 6px 14px; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--line); background: #21282d; color: var(--text);
}
button.approve { background: #12341f; border-color: #1d5c33; color: #7ee2a0; }
button.dismiss { background: #2a2023; border-color: #4d2b2e; color: #f0a5a0; }
button:hover { filter: brightness(1.25); }
.empty { padding: 22px 14px; color: var(--muted); text-align: center; }
.trace-row td { padding: 5px 14px; }
.trace-err { color: var(--danger); }
.note {
  margin: 10px 14px; padding: 8px 10px; border-radius: 4px;
  background: #12191d; color: var(--muted); font-size: 12px;
  border: 1px solid var(--line);
}
pre.payload {
  margin: 8px 0 0; padding: 8px 10px; background: #0d1215; border-radius: 4px;
  font-family: var(--mono); font-size: 12px; overflow-x: auto; color: var(--ok);
}
</style>
</head>
<body>
<header>
  <h1>OUTPOST</h1>
  <span class="tag">{{ settings.site_id if settings else '' }} &middot; all inference local &middot; no patient data leaves the box</span>
</header>
<div class="wrap">
{% block content %}{% endblock %}
</div>
</body>
</html>
